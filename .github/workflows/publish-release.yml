name: Publish PR releases
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to backfill, or empty for all open PRs
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: recorder-pr-releases
  cancel-in-progress: false
env:
  SOURCE_REPO: Corax34/ucp_recorder
jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      builds: ${{ steps.prs.outputs.builds }}
      tests: ${{ steps.prs.outputs.tests }}
      count: ${{ steps.prs.outputs.count }}
    steps:
      # Publisher code always comes from the trusted default branch.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - id: prs
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_PR: ${{ inputs.pr || github.event.pull_request.number }}
        run: python tools/pr_releases.py discover
  verify:
    needs: discover
    if: needs.discover.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.tests) }}
    runs-on: ${{ matrix.os }}
    # PR code runs only here, without write permissions, secrets or shared cache.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install lupa==2.6 unicorn==2.1.4
      - run: python -m unittest discover -s tests -v
  package:
    needs: [discover, verify]
    if: needs.discover.outputs.count != '0'
    strategy:
      matrix: ${{ fromJSON(needs.discover.outputs.builds) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: publisher
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.sha }}
          path: source
          persist-credentials: false
      - name: Package clean source with the trusted builder
        env:
          PR_BUILD: ${{ toJSON(matrix) }}
        run: python publisher/tools/pr_releases.py package
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.tag }}
          path: out/*
          if-no-files-found: error
  publish:
    needs: [discover, package]
    if: needs.discover.outputs.count != '0'
    strategy:
      matrix: ${{ fromJSON(needs.discover.outputs.builds) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.tag }}
          path: out
      - name: Publish immutable PR test release
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BUILD: ${{ toJSON(matrix) }}
        run: python tools/pr_releases.py publish
