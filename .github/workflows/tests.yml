name: Recorder tests
on: [push, pull_request]
jobs:
  lua:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: UnofficialCrusaderPatch/extension-files
          ref: 981b1becbc01fb282ead0415074f696bfefca07a
          path: files-reference
      - uses: actions/checkout@v4
        with:
          repository: Krarilotus/ucp-extension-map-extensions
          ref: 9d35dfb2495c277f199c0b38d3443742046010ff
          path: map-reference
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Krarilotus/ucp-extension-protocol
          ref: 175d7a96ad5add2627b7244826586026b618a504
          path: protocol-reference
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install lupa==2.6 unicorn==2.1.4
      - run: python -m unittest discover -s tests -v
        env:
          UCP_FILES_TEST_ROOT: files-reference
          UCP_MAP_TEST_ROOT: map-reference
          UCP_PROTOCOL_TEST_ROOT: protocol-reference
