meta:
  version: 1.0.0
options:
- url: recorder.singleplayerRngDiagnostics
  header: "Single-player RNG diagnostics"
  text: "Log which game functions consume random values during recording and playback. Enable before making a test recording; keep the same settings for playback. Adds diagnostic overhead and up to 64 MiB per attempt. Diagnostic failures do not stop the match."
  hasHeader: true
  display:
  contents:
    type: boolean
    value: false
- url: recorder.autoRecord
  header: "Record Skirmishes automatically"
  text: "Record new single-player Skirmishes and save them when you leave the match. Named copies can also be saved from the pause menu."
  hasHeader: true
  display:
  contents:
    type: boolean
    value: true
- url: recorder.rngLogMethod
  header: "Type of logging method"
  text: "Type of logging method for recorded gameplay"
  hasHeader: true
  display:
  contents:
    type: string
    value: "trace"
- url: recorder.useFixedSeed
  header: "Use fixed seed"
  text: "Use the configured starting seed for single-player recorder sessions"
  hasHeader: true
  display:
  contents:
    type: boolean
    value: true
- url: fixedSeed
  header: "Fixed Seed"
  text: "A seed can be entered in case fixed seeds are used"
  hasHeader: true
  display:
  contents:
    type: integer
    value: 1
- url: recorder.multiplayerDiagnostics
  header: "Multiplayer diagnostics"
  text: "Log executed multiplayer commands and resource/RNG evidence for comparison. This does not enable multiplayer replay."
  hasHeader: true
  display:
  contents:
    type: boolean
    value: false
- url: recorder.multiplayerDiagnosticsStartTick
  header: "Diagnostic window start tick"
  text: "For bounded multiplayer diagnostics, use the same multiple of 64 on both peers. Ignored when the end tick is zero."
  hasHeader: true
  display:
  contents:
    type: integer
    value: 64
- url: recorder.multiplayerDiagnosticsEndTick
  header: "Diagnostic window end tick"
  text: "Zero logs until mission exit. A later multiple of 64 seals the evidence at this simulation boundary, before either peer needs to leave. Use the same window on both peers. This does not stop the match or enable replay."
  hasHeader: true
  display:
  contents:
    type: integer
    value: 0
