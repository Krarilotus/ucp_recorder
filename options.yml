meta:
  version: 1.0.0
options:
- url: recorder.singleplayerRngDiagnostics
  header: "{{rng_header}}"
  text: "{{rng_text}}"
  hasHeader: true
  display:
  contents:
    type: boolean
    value: false
- url: recorder.autoRecord
  header: "{{auto_header}}"
  text: "{{auto_text}}"
  hasHeader: true
  display:
  contents:
    type: boolean
    value: true
- url: recorder.useFixedSeed
  header: "{{seed_on_header}}"
  text: "{{seed_on_text}}"
  hasHeader: true
  display:
  contents:
    type: boolean
    value: true
- url: recorder.fixedSeed
  enabled: recorder.useFixedSeed
  header: "{{seed_header}}"
  text: "{{seed_text}}"
  hasHeader: true
  display:
  contents:
    type: integer
    value: 1
- url: recorder.multiplayerDiagnostics
  header: "{{mp_header}}"
  text: "{{mp_text}}"
  hasHeader: true
  display:
  contents:
    type: boolean
    value: false
- url: recorder.multiplayerDiagnosticsStartTick
  header: "{{start_header}}"
  text: "{{start_text}}"
  hasHeader: true
  display:
  contents:
    type: integer
    value: 64
- url: recorder.multiplayerDiagnosticsEndTick
  header: "{{end_header}}"
  text: "{{end_text}}"
  hasHeader: true
  display:
  contents:
    type: integer
    value: 0
